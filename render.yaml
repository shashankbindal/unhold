# Render Blueprint: https://render.com/docs/blueprint-spec
# Leave the PayPal vars empty to run with the clearly-labelled offline MOCK PayPal.
services:
  - type: web
    name: unhold
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        sync: false
